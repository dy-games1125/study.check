<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스터디 파밍 (Study Farming)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
    body { background-color: #f0fdf4; color: #1f2937; display: flex; justify-content: center; padding: 20px; }
    .app-container { width: 100%; max-width: 480px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 20px; border: 2px solid #bbf7d0; }
    
    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; background: #dcfce7; padding: 12px 16px; border-radius: 12px; font-weight: bold; margin-bottom: 15px; }
    .currency { color: #16a34a; }
    
    /* Nav Tabs */
    .nav-tabs { display: flex; gap: 6px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: #e5e7eb; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: #22c55e; color: white; }
    
    /* Tab Contents */
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    /* Farm View */
    .farm-area { background: #fef08a; height: 260px; border-radius: 16px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #facc15; overflow: hidden; margin-bottom: 15px; }
    .pot { width: 100px; height: 100px; background: #b45309; border-radius: 0 0 30px 30px; display: flex; align-items: center; justify-content: center; font-size: 40px; cursor: pointer; position: relative; box-shadow: inset 0 8px 0 #78350f; }
    .plant-stage { position: absolute; top: -50px; font-size: 50px; }
    .water-btn { position: absolute; top: 15px; right: 15px; background: #3b82f6; color: white; border: none; padding: 8px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; display: none; animation: bounce 1s infinite; }
    .guest-animal { position: absolute; bottom: 20px; left: 20px; font-size: 40px; cursor: pointer; animation: pulse 1.5s infinite; }
    
    /* Timer Controls */
    .timer-display { font-size: 32px; font-weight: bold; text-align: center; margin-bottom: 10px; color: #15803d; }
    .progress-bar-container { width: 100%; height: 16px; background: #e5e7eb; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
    .progress-bar { width: 0%; height: 100%; background: #22c55e; transition: width 0.3s; }
    .controls { display: flex; gap: 10px; margin-bottom: 10px; }
    .input-time { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; text-align: center; font-size: 16px; }
    .btn { padding: 10px 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #22c55e; color: white; }
    .btn:disabled { background: #9ca3af; }
    
    /* Grid & Cards */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; text-align: center; position: relative; }
    .card-title { font-weight: bold; margin-bottom: 4px; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; color: white; margin-bottom: 6px; }
    .common { background: #6b7280; } .rare { background: #3b82f6; } .legendary { background: #eab308; } .mythic { background: #ec4899; }
    
    /* Shop & Inventory */
    .shop-box { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 12px; border-radius: 10px; margin-bottom: 10px; text-align: center; }
    
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Header -->
  <div class="header">
    <span>🔥 연속 공부: <span id="streak-count">0</span>일</span>
    <span class="currency">🧪 영양분: <span id="points">0</span>pt</span>
  </div>

  <!-- Navigation Tabs -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('farm')">🌱 농장</button>
    <button class="tab-btn" onclick="switchTab('inventory')">🎒 가방</button>
    <button class="tab-btn" onclick="switchTab('shop')">🏪 상점</button>
    <button class="tab-btn" onclick="switchTab('codex')">📖 도감</button>
  </div>

  <!-- 1. Farm Tab -->
  <div id="tab-farm" class="tab-content active">
    <div class="farm-area">
      <button id="water-btn" class="water-btn" onclick="giveWater()">💧 물주기!</button>
      <div class="pot" onclick="plantSeedFromPot()">
        <div id="plant-display" class="plant-stage"></div>
      </div>
      <div id="guest-area"></div>
    </div>

    <div class="timer-display" id="timer-text">00:00</div>
    <div class="progress-bar-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>

    <div class="controls">
      <input type="number" id="target-minutes" class="input-time" placeholder="목표(분)" min="1" value="25">
      <button id="start-btn" class="btn" onclick="startStudy()">공부 시작</button>
    </div>
  </div>

  <!-- 2. Inventory Tab -->
  <div id="tab-inventory" class="tab-content">
    <h4 style="margin-bottom:8px;">🐾 장착 펫 (최대 2마리)</h4>
    <div id="equipped-pets" style="display:flex; gap:10px; margin-bottom:15px;"></div>
    
    <h4 style="margin-bottom:8px;">📦 보유 씨앗</h4>
    <div id="seed-inventory" class="grid" style="margin-bottom:15px;"></div>

    <h4 style="margin-bottom:8px;">🛡️ 보유 아이템</h4>
    <div id="item-inventory" class="grid"></div>
  </div>

  <!-- 3. Shop Tab -->
  <div id="tab-shop" class="tab-content">
    <div class="shop-box">
      <h3>🎰 씨앗 뽑기</h3>
      <p style="font-size:12px; color:#666; margin:4px 0 8px 0;">100pt 소모 (랜덤 씨앗 획득)</p>
      <button class="btn" onclick="drawSeed()">100pt로 뽑기</button>
    </div>
    <div class="shop-box">
      <h3>🌈 무지개 영양제</h3>
      <p style="font-size:12px; color:#666; margin:4px 0 8px 0;">10,000pt (연속 공부 1회 자동 방어)</p>
      <button class="btn" onclick="buyStreakShield()">10,000pt로 구매</button>
    </div>
    <div class="shop-box">
      <h3>🧪 희귀 미끼</h3>
      <p style="font-size:12px; color:#666; margin:4px 0 8px 0;">2,000pt (다음 공부 시 희귀 이상 펫 등장률↑)</p>
      <button class="btn" onclick="buyBait()">2,000pt로 구매</button>
    </div>
  </div>

  <!-- 4. Codex Tab -->
  <div id="tab-codex" class="tab-content">
    <h4 style="margin-bottom:8px;">🐾 펫 도감 & 능력치</h4>
    <div id="pet-codex" class="grid"></div>
  </div>
</div>

<script>
  // Game State
  let state = {
    points: 1000,
    streak: 1,
    seeds: { '방울토마토': 1 },
    pets: [],
    equippedPets: [],
    items: { streakShield: 0, rareBait: 0 },
    activeSeed: null,
    isStudying: false,
    timer: null,
    totalSeconds: 0,
    currentSeconds: 0,
    waterEvents: [false, false, false],
    currentGuest: null
  };

  const PET_DATA = {
    '🐝 꿀벌': { grade: 'common', prob: 60, skill: '완주 포인트 +5%' },
    '🐞 무당벌레': { grade: 'common', prob: 60, skill: '물주기 시 +50pt' },
    '🐥 아기 병아리': { grade: 'rare', prob: 28, skill: '일시정지 유예' },
    '🐿️ 다람쥐': { grade: 'rare', prob: 28, skill: '완주 시 +150pt' },
    '🐱 꼬마 고양이': { grade: 'legendary', prob: 10, skill: '고급 씨앗 확률↑' },
    '🐰 아기 토끼': { grade: 'legendary', prob: 10, skill: '첫 완료 +300pt' },
    '🦄 아기 유니콘': { grade: 'mythic', prob: 2, skill: '완주 포인트 2배 (1000pt → 2000pt)' },
    '🐉 아기용': { grade: 'mythic', prob: 2, skill: '중단 방지 + 보너스 500pt' },
    '🌟 별빛 아기곰': { grade: 'mythic', prob: 2, skill: '희귀 씨앗 2배 확률' }
  };

  const SEEDS_LIST = ['🍅 방울토마토', '🌼 민들레', '🌻 해바라기', '🍓 딸기', '🌲 세계수'];

  function updateUI() {
    document.getElementById('points').innerText = state.points.toLocaleString();
    document.getElementById('streak-count').innerText = state.streak;
    renderInventory();
    renderCodex();
  }

  function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(`tab-${tabName}`).classList.add('active');
  }

  /* Farm & Timer Logic */
  function plantSeedFromPot() {
    if (state.isStudying) return;
    const seedNames = Object.keys(state.seeds);
    if (seedNames.length === 0) {
      alert("인벤토리에 씨앗이 없습니다. 상점에서 뽑아주세요!");
      return;
    }
    state.activeSeed = seedNames[0];
    document.getElementById('plant-display').innerText = '🌱';
    alert(`${state.activeSeed} 씨앗을 화분에 심었습니다!`);
  }

  function startStudy() {
    if (!state.activeSeed) {
      alert("화분을 클릭하여 먼저 씨앗을 심어주세요!");
      return;
    }
    const mins = parseInt(document.getElementById('target-minutes').value);
    if (isNaN(mins) || mins <= 0) return;

    state.isStudying = true;
    state.totalSeconds = mins * 60;
    state.currentSeconds = 0;
    state.waterEvents = [false, false, false];
    document.getElementById('start-btn').disabled = true;

    state.timer = setInterval(tick, 1000);
  }

  function tick() {
    state.currentSeconds++;
    const pct = (state.currentSeconds / state.totalSeconds) * 100;
    
    // Timer UI
    const rem = state.totalSeconds - state.currentSeconds;
    const m = Math.floor(rem / 60).toString().padStart(2, '0');
    const s = (rem % 60).toString().padStart(2, '0');
    document.getElementById('timer-text').innerText = `${m}:${s}`;
    document.getElementById('progress-bar').style.width = `${pct}%`;

    // 25%, 50%, 75% Water Events
    if (pct >= 25 && !state.waterEvents[0]) triggerWater(0, '🌿');
    if (pct >= 50 && !state.waterEvents[1]) triggerWater(1, '🌿🌿');
    if (pct >= 75 && !state.waterEvents[2]) triggerWater(2, '🌸');

    // Animal Spawn Random Check
    if (pct >= 50 && !state.currentGuest && Math.random() < 0.05) {
      spawnGuest();
    }

    if (state.currentSeconds >= state.totalSeconds) {
      completeStudy();
    }
  }

  function triggerWater(idx, stageIcon) {
    state.waterEvents[idx] = true;
    document.getElementById('water-btn').style.display = 'block';
    document.getElementById('plant-display').innerText = stageIcon;
  }

  function giveWater() {
    document.getElementById('water-btn').style.display = 'none';
    alert("촉촉하게 물을 주었습니다! 식물이 자라납니다.");
  }

  function spawnGuest() {
    const keys = Object.keys(PET_DATA);
    let chosen = keys[Math.floor(Math.random() * keys.length)];
    if (state.items.rareBait > 0) {
      chosen = '🦄 아기 유니콘'; // 미끼 사용 효과
      state.items.rareBait--;
    }
    state.currentGuest = chosen;
    const area = document.getElementById('guest-area');
    area.innerHTML = `<div class="guest-animal" onclick="catchGuest()">${chosen.split(' ')[0]}</div>`;
  }

  function catchGuest() {
    if (!state.currentGuest) return;
    alert(`${state.currentGuest} 손님을 클릭하여 포획했습니다! 인벤토리로 이동합니다.`);
    if (!state.pets.includes(state.currentGuest)) {
      state.pets.push(state.currentGuest);
    }
    state.currentGuest = null;
    document.getElementById('guest-area').innerHTML = '';
    updateUI();
  }

  function completeStudy() {
    clearInterval(state.timer);
    state.isStudying = false;
    document.getElementById('start-btn').disabled = false;
    document.getElementById('plant-display').innerText = '🍎';

    // Reward Calculation
    let reward = 1000;
    if (state.equippedPets.includes('🦄 아기 유니콘')) reward *= 2;
    if (state.equippedPets.includes('🐉 아기용')) reward += 500;

    // Deduct seed
    state.seeds[state.activeSeed]--;
    if (state.seeds[state.activeSeed] <= 0) delete state.seeds[state.activeSeed];
    state.activeSeed = null;

    state.points += reward;
    alert(`🎉 공부 완료! 결실을 수확했습니다. (+${reward}pt 획득)`);
    updateUI();
  }

  /* Shop & Draw */
  function drawSeed() {
    if (state.points < 100) { alert("영양분 포인트가 부족합니다."); return; }
    state.points -= 100;
    const picked = SEEDS_LIST[Math.floor(Math.random() * SEEDS_LIST.length)];
    state.seeds[picked] = (state.seeds[picked] || 0) + 1;
    alert(`🎰 뽑기 성공! [${picked}] 씨앗을 획득했습니다.`);
    updateUI();
  }

  function buyStreakShield() {
    if (state.points < 10000) { alert("영양분 포인트가 부족합니다."); return; }
    state.points -= 10000;
    state.items.streakShield++;
    alert("🌈 무지개 영양제를 구매했습니다! 연속 공부가 안전하게 보호됩니다.");
    updateUI();
  }

  function buyBait() {
    if (state.points < 2000) { alert("영양분 포인트가 부족합니다."); return; }
    state.points -= 2000;
    state.items.rareBait++;
    alert("🧪 희귀 미끼를 구매했습니다! 다음 공부 세션에 전설/신화 동물이 유인됩니다.");
    updateUI();
  }

  /* Inventory & Equip */
  function renderInventory() {
    // Seed
    const seedBox = document.getElementById('seed-inventory');
    seedBox.innerHTML = '';
    for (let [name, count] of Object.entries(state.seeds)) {
      seedBox.innerHTML += `<div class="card"><div class="card-title">${name}</div><div>수량: ${count}개</div></div>`;
    }

    // Items
    const itemBox = document.getElementById('item-inventory');
    itemBox.innerHTML = `
      <div class="card"><div class="card-title">🌈 무지개 영양제</div><div>${state.items.streakShield}개</div></div>
      <div class="card"><div class="card-title">🧪 희귀 미끼</div><div>${state.items.rareBait}개</div></div>
    `;

    // Equipped Pets
    const eqBox = document.getElementById('equipped-pets');
    eqBox.innerHTML = '';
    for (let i = 0; i < 2; i++) {
      const pet = state.equippedPets[i];
      eqBox.innerHTML += `
        <div class="card" style="flex:1;">
          <div class="card-title">슬롯 ${i+1}</div>
          <div>${pet || '비어 있음'}</div>
          ${pet ? `<button class="btn" style="padding:2px 6px; font-size:10px; margin-top:4px;" onclick="unequipPet(${i})">해제</button>` : ''}
        </div>
      `;
    }
  }

  function equipPet(petName) {
    if (state.equippedPets.includes(petName)) return;
    if (state.equippedPets.length >= 2) {
      alert("펫은 최대 2마리까지 장착 가능합니다. 먼저 슬롯을 비워주세요.");
      return;
    }
    state.equippedPets.push(petName);
    updateUI();
  }

  function unequipPet(idx) {
    state.equippedPets.splice(idx, 1);
    updateUI();
  }

  /* Codex */
  function renderCodex() {
    const box = document.getElementById('pet-codex');
    box.innerHTML = '';
    for (let [name, info] of Object.entries(PET_DATA)) {
      const isOwned = state.pets.includes(name);
      box.innerHTML += `
        <div class="card" style="opacity: ${isOwned ? '1' : '0.5'}">
          <span class="badge ${info.grade}">${info.grade.toUpperCase()} (${info.prob}%)</span>
          <div class="card-title">${isOwned ? name : '???'}</div>
          <div style="font-size:11px; color:#555;">${info.skill}</div>
          ${isOwned ? `<button class="btn" style="padding:4px 8px; font-size:10px; margin-top:6px;" onclick="equipPet('${name}')">장착</button>` : ''}
        </div>
      `;
    }
  }

  // Initialize
  updateUI();
</script>
</body>
</html>
